name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project
          unzip -q AILiveTranslator.zip -d project

          echo "Searching for Gradle project..."
          find project -type f -name "gradlew" -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and build Android project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside AILiveTranslator.zip"
            echo "Files inside ZIP:"
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found at:"
          echo "$GRADLEW"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Starting Android APK build..."

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AILiveTranslator-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
