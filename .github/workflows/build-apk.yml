name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project
          unzip -q AILiveTranslator.zip -d project

          echo "=== Searching for Gradle wrapper ==="
          find project -type f -name "gradlew" -print

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Files extracted from ZIP:"
            find project -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Building APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK files ==="
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AILiveTranslator-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
